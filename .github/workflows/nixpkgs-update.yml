name: Nixpkgs update
on:
  schedule:
    - cron: '20 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31

      - name: Setup git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update nixpkgs
        run: |
          nix shell github:NixOS/nixpkgs/nixos-unstable#jq \
            -c tools/update_nixpkgs_flake.sh

      - name: Push updates
        run: git push origin HEAD:master
