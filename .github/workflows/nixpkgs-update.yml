name: Nixpkgs update
on:
  schedule:
    - cron: '20 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

env:
  CONFCTL_FLAKE: github:vpsfreecz/confctl/822c0e35dbe2549111912f539116b4225dfd3035#confctl
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: master

      - uses: cachix/install-nix-action@31.11.3

      - name: Restore confctl cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/confctl
          key: confctl-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            confctl-cache-${{ runner.os }}

      - name: Save lock baseline
        run: |
          cp flake.lock "$RUNNER_TEMP/flake-update-baseline.lock"
          echo "UPDATE_OLD_LOCK=$RUNNER_TEMP/flake-update-baseline.lock" >> "$GITHUB_ENV"

      - name: Setup git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update nixpkgs
        run: |
          nix shell github:NixOS/nixpkgs/nixos-unstable#jq \
            -c tools/update_nixpkgs_flake.sh

      - name: Push updates
        run: |
          final_lock="$RUNNER_TEMP/flake-update-final.lock"
          git show HEAD:flake.lock > "$final_lock"
          nix shell "$CONFCTL_FLAKE" -c confctl inputs check-update \
            --old-lock "$UPDATE_OLD_LOCK" --new-lock "$final_lock"
          git push origin HEAD:master

      - name: Save confctl cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/confctl
          key: confctl-cache-${{ runner.os }}-${{ github.run_id }}
